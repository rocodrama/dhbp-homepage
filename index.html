<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 이 앱은 지금까지 의도한 타이포로 렌더된 적이 없다: index.css 스택에 'Pretendard'가
         있었지만 로드하는 곳이 없어서 Windows에서는 전부 맑은 고딕으로 떨어졌다.
         dynamic-subset이라 실제 쓰는 글자만 내려온다. font-display: swap은 CDN 쪽에 이미 있다.

         integrity: 서드파티 CDN에서 받는 CSS다. CSS는 JS를 실행하진 못해도 속성 셀렉터와
         background-image URL로 값을 유출하거나 화면을 덮을 수 있다. @v1.3.9 태그는 내용이
         불변이라 해시로 고정할 수 있다. 해시가 어긋나면 브라우저가 스타일시트를 거부하고
         시스템 폰트로 떨어진다 — 404와 같은 안전한 실패다.
         (woff2 본체는 CSS 안에서 참조되므로 SRI를 걸 수 없다. 다만 폰트 바이너리는
         CSS보다 공격 표면이 훨씬 좁다.) -->
    <link
      rel="stylesheet"
      crossorigin="anonymous"
      integrity="sha384-GIdEBaqGN9mNkDkMkzMHW8EKUqtpPIe/sLj1X7DIrnc9uPtLROJgmuDlh+3rBw0j"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <!-- 홈 화면에 추가하면 주소창 없이 앱처럼 뜬다 (PWA).
         안드로이드·iOS 를 따로 빌드하지 않는다. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />

    <!-- iOS 사파리는 매니페스트를 거의 안 읽는다. 아이콘과 상태바는 여기서 정해야 하고,
         설치는 사용자가 공유 → "홈 화면에 추가" 를 직접 해야 한다. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DHBP" />

    <title>랩실 홈페이지</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
